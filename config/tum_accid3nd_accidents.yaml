# Manually annotated accidents in TUM Traffic Accid3nD (watched frame by frame).
# Every sequence is listed; [] = no contact in view (aftermath, fire, night, ...).
# The labels' 3D cuboids cannot be used as collision ground truth: their footprints
# overlap all the time (trailers, buses, jitter) and miss the real contacts.
#
# time:      absolute unix time (s) of the first contact (single-vehicle: loss of control),
#            same clock as the image file names
# cameras:   cameras that see it -> approximate image location of the contact (full-res px, 1920x1200)
# vehicles:  what happened

r09_s01:
  - time: 1617874312.76
    vehicles: "white van stopped in the left lane since the start of the sequence (traffic swerves around it); a yellow car squeezes between the van and the median barrier, hits the barrier and the van, which is pushed forward"
    cameras:
      s050_camera_basler_south_16mm: [700, 220]
      s050_camera_basler_south_50mm: [520, 600]

